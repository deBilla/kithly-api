{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" .Release.Name }}
{{- /* Reuse the existing password on upgrade; generate one only on first install. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "POSTGRES_PASSWORD") }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- /* Alphanumeric so it can be embedded in DATABASE_URL without escaping. */}}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kithly.labels" . | nindent 4 }}
  annotations:
    # Losing this secret means losing access to the data — never delete it with the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kithly.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kithly.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kithly.labels" . | nindent 4 }}
    {{- include "kithly.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kithly.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kithly.labels" . | nindent 8 }}
        {{- include "kithly.selectorLabels" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      # Give Postgres time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            {{- toYaml .Values.postgres.args | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: POSTGRES_PASSWORD
            # Subdirectory, so initdb doesn't trip over lost+found on the volume root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        # The container default /dev/shm is 64M, too small for parallel queries.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  # PVCs from volumeClaimTemplates are not deleted on uninstall — data survives the release.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- with .Values.postgres.backup }}
{{- if .enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "kithly.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ .timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "kithly.selectorLabels" (dict "root" $ "name" "postgres-backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- $dump := include "kithly.postgresDumpContainer" (dict "root" $ "name" $name "backup" .) }}
          {{- if .s3Uri }}
          initContainers:
            {{- $dump | nindent 12 }}
          containers:
            - name: upload
              image: {{ .awsCliImage }}
              command: ["sh", "-c"]
              args:
                - aws s3 cp "$(cat /backups/LATEST)" "{{ .s3Uri }}/" --only-show-errors && echo "uploaded $(cat /backups/LATEST)"
              envFrom:
                # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION, as the app uses.
                - secretRef:
                    name: {{ $.Values.envSecretName }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  readOnly: true
          {{- else }}
          containers:
            {{- $dump | nindent 12 }}
          {{- end }}
          volumes:
            # A host directory, not a PVC: local-path binds a PVC only when its first
            # consumer runs, and an unbound PVC holds `helm upgrade --wait` until the
            # first nightly backup — it timed out the first deploy.
            - name: backups
              hostPath:
                path: {{ .hostPath }}
                type: DirectoryOrCreate
{{- end }}
{{- end }}
{{- end }}
