{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kithly.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    # Plain HTTP: TLS is terminated at Cloudflare and the tunnel connects over localhost.
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
{{- range $name, $route := .Values.gateway.routes }}
{{- $svc := required (printf "gateway.routes.%s.service %q is not in services" $name $route.service) (index $.Values.services $route.service) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "kithly.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Release.Name }}
      sectionName: http
  hostnames:
    {{- toYaml $route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $.Release.Name }}-{{ $route.service }}
          port: {{ $svc.port }}
{{- end }}
{{- end }}
