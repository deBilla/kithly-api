services:
  api:
    build:
      context: .
      args:
        BINARY: api
    ports:
      - "80:3001"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 2G

  worker:
    build:
      context: .
      args:
        BINARY: worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 4G

  transcoder-worker:
    build:
      context: .
      args:
        BINARY: transcoder
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  bull-board-dashboard:
    build:
      context: .
      args:
        BINARY: dashboard
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DASHBOARD_PORT=3002
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

  playground:
    build:
      context: .
      args:
        BINARY: playground
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - API_URL=http://api:3001
      - PLAYGROUND_PORT=3003
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 512M
