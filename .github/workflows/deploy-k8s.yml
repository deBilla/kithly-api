name: Deploy to k3s (home server)

# Push to main (and manual dispatch): tests -> build & push images to GHCR ->
# helm upgrade on the k3s host. The deploy job runs only when the DEPLOY_HOST
# repo variable is set (see docs/K8S_DEPLOYMENT.md); without it, CI only tests.
# PRs: tests + chart validation only.
on:
  push:
    branches: [main]
    # Docs-only merges don't redeploy.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'deploy/helm/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.1.3
  KUBECONFORM_VERSION: v0.7.0
  K8S_VERSION: 1.36.0
  CHART_DIR: deploy/helm/kithly
  RELEASE: kithly
  NAMESPACE: kithly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint and validate rendered manifests
        env:
          # Gateway API kinds aren't in the core schemas.
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          kubeconform() { command kubeconform -schema-location default -schema-location "$CRD_SCHEMAS" "$@"; }
          helm lint "$CHART_DIR" --set image.tag=ci
          helm template "$RELEASE" "$CHART_DIR" --set image.tag=ci \
            | kubeconform -strict -summary -kubernetes-version "$K8S_VERSION"
          helm template "$RELEASE" "$CHART_DIR" --set image.tag=ci --set database.inCluster=true \
            --set postgres.backup.s3Uri=s3://ci/backups \
            | kubeconform -strict -summary -kubernetes-version "$K8S_VERSION"

  build:
    needs: [test, chart]
    # Images are published only where a deploy target is configured, so forks
    # (and this public repo) never push into a registry someone else deploys from.
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        binary: [api, worker, transcoder, dashboard, playground]
    steps:
      - uses: actions/checkout@v4

      - name: Registry (GHCR names must be lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.binary }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BINARY=${{ matrix.binary }}
          push: true
          # One manifest per push (no attestation index), so each deploy is exactly
          # one package version and the count-based cleanup below can't split an image.
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/kithly-${{ matrix.binary }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: vars.DEPLOY_HOST != ''
    environment: production
    env:
      # user@host reachable over SSH (here via Cloudflare Access; see SSH_CONFIG).
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Registry (GHCR names must be lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Add SSH config and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.SSH_CONFIG }}" >> ~/.ssh/config

      - name: Check cluster is bootstrapped
        run: |
          ssh "$DEPLOY_HOST" 'command -v helm >/dev/null && kubectl get ns "'"$NAMESPACE"'" >/dev/null' \
            || { echo "::error::k3s/helm not ready on the home server — run the 'Bootstrap k3s' workflow first"; exit 1; }

      # Secrets are written to files on the runner and streamed over SSH stdin, so
      # their values never appear in a command line, a log, or helm release history.
      - name: Sync secrets to the cluster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER || github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          umask 077
          required="GEMINI_API_KEY AWS_REGION AWS_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY FIREBASE_SERVICE_ACCOUNT_BASE64 GHCR_PULL_TOKEN"
          for k in $required; do
            [ -n "${!k}" ] || { echo "::error::secret $k is not set"; exit 1; }
          done

          : > kithly.env
          for k in DATABASE_URL GEMINI_API_KEY AWS_REGION AWS_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                   FIREBASE_SERVICE_ACCOUNT_BASE64 ADMIN_API_KEY MAILGUN_API_KEY; do
            if [ -n "${!k}" ]; then printf '%s=%s\n' "$k" "${!k}" >> kithly.env; fi
          done
          # Rolls pods when (and only when) a secret value changed.
          echo "ENV_CHECKSUM=$(sha256sum kithly.env | cut -c1-16)" >> "$GITHUB_ENV"

          jq -n --arg auth "$(printf '%s:%s' "$GHCR_PULL_USER" "$GHCR_PULL_TOKEN" | base64 -w0)" \
            '{auths: {"ghcr.io": {auth: $auth}}}' > dockerconfig.json

          # Reads a file from stdin into a private temp file and applies it as a Secret.
          apply_secret() {
            ssh "$DEPLOY_HOST" "set -e; f=\$(mktemp); trap 'rm -f \$f' EXIT; cat > \$f; \
              kubectl -n $NAMESPACE create secret generic $1 $2=\$f --dry-run=client -o yaml \
              | kubectl apply -f -"
          }
          apply_secret kithly-env --from-env-file < kithly.env
          apply_secret ghcr-pull "--type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson" < dockerconfig.json
          rm -f kithly.env dockerconfig.json

      - name: Upload chart
        run: |
          tar -C "$(dirname "$CHART_DIR")" -cz "$(basename "$CHART_DIR")" \
            | ssh "$DEPLOY_HOST" 'rm -rf ~/kithly-chart && mkdir -p ~/kithly-chart && tar -xz -C ~/kithly-chart'

      - name: Helm upgrade
        env:
          # true (default) = in-cluster Postgres; false = external DB from the DATABASE_URL secret.
          DB_IN_CLUSTER: ${{ vars.DB_IN_CLUSTER || 'true' }}
          # Off-machine copy of the nightly Postgres dump, e.g. s3://kithly-db-backups/postgres. Empty = local PVC only.
          DB_BACKUP_S3_URI: ${{ vars.DB_BACKUP_S3_URI }}
        run: |
          ssh "$DEPLOY_HOST" "helm upgrade --install $RELEASE ~/kithly-chart/$(basename "$CHART_DIR") \
            --namespace $NAMESPACE \
            --set image.registry=$REGISTRY \
            --set image.tag=$GITHUB_SHA \
            --set-string envChecksum=$ENV_CHECKSUM \
            --set database.inCluster=$DB_IN_CLUSTER \
            --set-string postgres.backup.s3Uri=$DB_BACKUP_S3_URI \
            --rollback-on-failure --timeout 10m"

      - name: Show release state
        if: always()
        run: |
          ssh "$DEPLOY_HOST" "helm -n $NAMESPACE history $RELEASE --max 5; \
            kubectl -n $NAMESPACE get deploy,pods,svc -o wide"

      - name: Diagnostics on failure
        if: failure()
        run: |
          ssh "$DEPLOY_HOST" "kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -40; \
            for p in \$(kubectl -n $NAMESPACE get pods -o name); do \
              echo \"--- \$p\"; kubectl -n $NAMESPACE logs \$p --all-containers --tail=30 || true; done"

  # Keep the newest N versions of each image. Runs only after a successful
  # deploy, so the running image (the newest) is never a candidate, and the
  # previous ones stay available for `helm rollback`.
  cleanup-images:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        binary: [api, worker, transcoder, dashboard, playground]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: kithly-${{ matrix.binary }}
          package-type: container
          min-versions-to-keep: 20
